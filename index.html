<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Movie Recommender</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-dark text-light">
  <div class="container py-5">
    <div class="mb-4">
      <h1 class="mb-1">Mini Movie Recommender</h1>
      <p class="text-secondary">Select a genre and get movie recommendations.</p>
    </div>

    <div class="row mb-4 align-items-center">
      <div class="col-md-6">
        <select id="genreSelect" class="form-select">
          <option value="">All genres</option>
          <option value="Action">Action</option>
          <option value="Comedy">Comedy</option>
          <option value="Drama">Drama</option>
          <option value="Horror">Horror</option>
          <option value="Romance">Romance</option>
        </select>
      </div>
      <div class="col-md-6 text-md-end mt-2 mt-md-0">
        <button id="getRecBtn" class="btn btn-primary">Get Recommendations</button>
      </div>
    </div>

    <div id="recommendationGrid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
      <!-- Recommendation cards will appear here after selection -->
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
